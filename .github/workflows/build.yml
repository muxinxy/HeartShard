# HeartShard 多平台多架构编译
# 产物：
#   - 服务端：x86_64/aarch64/armv7 (linux-gnu)、x86_64-pc-windows-msvc
#   - 桌面便携 exe：x86_64-pc-windows-msvc
#   - Android APK：arm64-v8a / armeabi-v7a / x86_64
# 触发：push 到 main 或手动（workflow_dispatch）
#
# 注意：
#   - 仓库 .cargo/config.toml 将 target-dir 固定为仓库根 target/，所有产物路径
#     均按仓库根 target/ 计算。
#   - 仓库 .cargo/config.toml 将 crates.io 替换为 rsproxy 镜像；CI（海外 runner）
#     通过 --config / 就近 config 把该 source 指回官方 sparse index。
#   - SQLCipher 依赖 vendored OpenSSL（patches/openssl-src）；交叉编译不用 cross
#     （其容器缺路径依赖的父 workspace），改用 docker 挂载全仓库 + 多架构 gcc。
#   - tauri android 的 --target 只接受短名（aarch64/arm/x86_64）；gradle 任务名
#     跟 flavor 走（assembleArm64Release / assembleArmRelease / assembleX86_64Release）。

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  server-linux:
    name: server (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            docker: false
          - target: aarch64-unknown-linux-gnu
            docker: true
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cc: aarch64-linux-gnu-gcc
          - target: armv7-unknown-linux-gnueabihf
            docker: true
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            cc: arm-linux-gnueabihf-gcc
          - target: i686-unknown-linux-gnu
            docker: true
            packages: gcc-multilib libc6-dev-i386
            cc: gcc
    steps:
      - uses: actions/checkout@v4
      # CI（海外 runner）不走 rsproxy 镜像：注释掉 replace-with 即回官方 crates.io
      - name: Use crates.io directly
        run: sed -i "s/^replace-with/# replace-with/" .cargo/config.toml
      - name: Build (native)
        if: ${{ !matrix.docker }}
        working-directory: server
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Build (docker cross)
        if: matrix.docker
        run: |
          T="${{ matrix.target }}"
          U=$(echo "$T" | tr '[:lower:]-' '[:upper:]_')
          CC="${{ matrix.cc }}"
          AR="${{ matrix.cc }}"
          AR="${AR%gcc}ar"
          docker run --rm -v "$PWD":/work -w /work/server \
            -e "CARGO_TARGET_${U}_LINKER=$CC" \
            -e "CARGO_TARGET_${U}_CC=$CC" \
            -e "CARGO_TARGET_${U}_AR=$AR" \
            -e "CC=$CC" -e "AR=$AR" \
            rust:1 bash -c "set -e; sed -i 's/^replace-with/# replace-with/' /work/.cargo/config.toml; apt-get update -qq && apt-get install -y -qq ${{ matrix.packages }} pkg-config perl >/dev/null; rustup target add $T; cd /work/server && cargo build --release --target $T"
      - name: Prepare
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/heartshard-server dist/heartshard-server-${{ matrix.target }}
          cp server/server.toml.example dist/server.toml.example
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/*

  server-windows:
    name: server (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use crates.io directly
        shell: pwsh
        run: (Get-Content .cargo/config.toml) -replace '^replace-with', '# replace-with' | Set-Content .cargo/config.toml
      - name: Build server
        working-directory: server
        run: cargo build --release
      - name: Build desktop portable exe
        working-directory: apps/tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build
        env:
          # CI 无签名需求；跳过 updater
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/heartshard-server.exe dist/
          Copy-Item target/release/heartshard-tauri.exe dist/HeartShard-0.1.0-x64-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    name: android (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            tauri_target: aarch64
            gradle_task: assembleArm64Release
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            tauri_target: armv7
            gradle_task: assembleArmRelease
          - abi: x86_64
            target: x86_64-linux-android
            tauri_target: x86_64
            gradle_task: assembleX86_64Release
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # runner 自带 Android SDK（ANDROID_HOME 已设）；不用 setup-android action
      # （其 sdkmanager --update 在 ubuntu-22.04 镜像上会因许可/网络失败）
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install NDK via sdkmanager
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "ndk;28.2.13676358" >/dev/null || "$SDKM" --install "ndk;27.2.12479018" >/dev/null
      - name: Install frontend deps
        working-directory: apps/tauri
        run: pnpm install --frozen-lockfile
      - name: Init android project (if absent)
        working-directory: apps/tauri
        run: pnpm tauri android init || echo ok
      - name: Build .so
        working-directory: apps/tauri
        run: |
          NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/*/ | head -1)
          export ANDROID_NDK_ROOT="$NDK_ROOT"
          export NDK_HOME="$NDK_ROOT"
          # OpenSSL make install 需要 NDK 工具链（ranlib 等）在 PATH
          export PATH="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          sed -i "s/^replace-with/# replace-with/" "$GITHUB_WORKSPACE/.cargo/config.toml" || true
          pnpm tauri android build --target ${{ matrix.tauri_target }} || true
          if ! ls "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/libtauri_lib.so" >/dev/null 2>&1; then
            echo "libtauri_lib.so 未生成（cargo 交叉编译失败）"
            exit 1
          fi
      - name: Sync frontend assets
        working-directory: apps/tauri
        shell: pwsh
        run: |
          pnpm build
          New-Item -ItemType Directory -Force -Path src-tauri/gen/android/app/src/main/assets | Out-Null
          Copy-Item dist/* src-tauri/gen/android/app/src/main/assets -Recurse -Force
      - name: Copy .so + gradle
        run: |
          ABI="${{ matrix.abi }}"
          mkdir -p "apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/$ABI"
          SO=$(find target apps/tauri/src-tauri -name "libtauri_lib.so" -path "*${{ matrix.target }}*" ! -path "*jniLibs*" 2>/dev/null | head -1)
          if [ -z "$SO" ]; then echo "libtauri_lib.so not found"; exit 1; fi
          DEST="apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/$ABI/libtauri_lib.so"
          # tauri CLI 已把 jniLibs 链接建好时跳过拷贝（cp 会报 same file）
          if [ ! -e "$DEST" ]; then cp "$SO" "$DEST"; fi
          chmod +x apps/tauri/src-tauri/gen/android/gradlew
          cd apps/tauri/src-tauri/gen/android
          ./gradlew ${{ matrix.gradle_task }} --no-daemon
        env:
          HEARTSHARD_SKIP_RUST_TASK: "1"
          TAURI_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/tauri/android-release.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: heartshard-2026
          TAURI_ANDROID_KEY_ALIAS: heartshard
          TAURI_ANDROID_KEY_PASSWORD: heartshard-2026
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/release/app-*-release.apk
