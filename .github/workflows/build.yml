# HeartShard 多平台多架构编译
# 产物：
#   - 服务端：x86_64/aarch64/armv7 (linux-gnu)、x86_64-pc-windows-msvc
#   - 桌面便携 exe：x86_64-pc-windows-msvc
#   - Android APK：arm64-v8a / armeabi-v7a / x86_64
# 触发：push 到 main 或手动（workflow_dispatch）
#
# 注意：仓库 .cargo/config.toml 将 target-dir 固定为仓库根 target/，
#       所有产物路径均按仓库根 target/ 计算。
#       SQLCipher 依赖 vendored OpenSSL（patches/openssl-src），交叉编译
#       不用 cross（其容器挂载不含路径依赖的父 workspace），改用 docker
#       直接挂载全仓库 + 多架构 gcc。

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  server-linux:
    name: server (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            docker: false
          - target: aarch64-unknown-linux-gnu
            docker: true
          - target: armv7-unknown-linux-gnueabihf
            docker: true
          - target: i686-unknown-linux-gnu
            docker: true
    steps:
      - uses: actions/checkout@v4
      - name: Build (native)
        if: ${{ !matrix.docker }}
        working-directory: server
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Build (docker cross)
        if: matrix.docker
        run: |
          T="${{ matrix.target }}"
          U=$(echo "$T" | tr '[:lower:]-' '[:upper:]_')
          case "$T" in
            aarch64-unknown-linux-gnu)     GCCPKG=gcc-aarch64-linux-gnu;      CC=aarch64-linux-gnu-gcc;;
            armv7-unknown-linux-gnueabihf) GCCPKG=gcc-arm-linux-gnueabihf;    CC=arm-linux-gnueabihf-gcc;;
            i686-unknown-linux-gnu)        GCCPKG=gcc-i686-linux-gnu;         CC=i686-linux-gnu-gcc;;
            *) echo "unknown target $T"; exit 1;;
          esac
          AR="${CC%gcc}-ar"
          docker run --rm -v "$PWD":/work -w /work/server \
            -e "CARGO_TARGET_${U}_LINKER=$CC" \
            -e "CARGO_TARGET_${U}_CC=$CC" \
            -e "CARGO_TARGET_${U}_AR=$AR" \
            -e "CC=$CC" -e "AR=$AR" \
            rust:1 bash -c "set -e; apt-get update -qq && apt-get install -y -qq --no-install-recommends pkg-config perl $GCCPKG >/dev/null; rustup target add $T; cargo build --release --target $T"
      - name: Prepare
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/heartshard-server dist/heartshard-server-${{ matrix.target }}
          cp server/server.toml.example dist/server.toml.example
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/*

  server-windows:
    name: server (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build server
        working-directory: server
        run: cargo build --release
      - name: Build desktop portable exe
        working-directory: apps/tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build
        env:
          # CI 无签名需求；跳过 updater
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/heartshard-server.exe dist/
          Copy-Item target/release/heartshard-tauri.exe dist/HeartShard-0.1.0-x64-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    name: android (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # runner 自带 Android SDK（ANDROID_HOME 已设）；不用 setup-android action
      # （其 sdkmanager --update 在 ubuntu-22.04 镜像上会因许可/网络失败）
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install NDK via sdkmanager
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "ndk;28.2.13676358" >/dev/null || "$SDKM" --install "ndk;27.2.12479018" >/dev/null
      - name: Install frontend deps
        working-directory: apps/tauri
        run: pnpm install --frozen-lockfile
      - name: Init android project (if absent)
        working-directory: apps/tauri
        run: pnpm tauri android init || echo ok
      - name: Build .so
        working-directory: apps/tauri
        run: pnpm tauri android build --target ${{ matrix.target }} || true
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - name: Sync frontend assets
        working-directory: apps/tauri
        shell: pwsh
        run: |
          pnpm build
          New-Item -ItemType Directory -Force -Path src-tauri/gen/android/app/src/main/assets | Out-Null
          Copy-Item dist/* src-tauri/gen/android/app/src/main/assets -Recurse -Force
      - name: Copy .so + gradle
        run: |
          ABI="${{ matrix.abi }}"
          mkdir -p "apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/$ABI"
          SO=$(find target apps/tauri/src-tauri/target -name "libtauri_lib.so" -path "*${{ matrix.target }}*" 2>/dev/null | head -1)
          if [ -z "$SO" ]; then echo "libtauri_lib.so not found"; exit 1; fi
          cp "$SO" "apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/$ABI/libtauri_lib.so"
          chmod +x apps/tauri/src-tauri/gen/android/gradlew
          cd apps/tauri/src-tauri/gen/android
          ./gradlew assembleArm64Release --no-daemon || ./gradlew assembleRelease --no-daemon
        env:
          HEARTSHARD_SKIP_RUST_TASK: "1"
          JAVA_HOME: ${{ env.JAVA_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
