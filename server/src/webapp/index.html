<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>牧心相册</title>
<style>
:root { color-scheme: dark; --bg:#14161a; --card:#1b1e24; --border:#23262d; --fg:#e8e6e3; --muted:#8a8f98; --primary:#5b8def; --input:#12141a; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 16px; }
* { box-sizing: border-box; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(20,22,26,.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 17px; }
button { font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #1e2129; color: var(--fg); cursor: pointer; }
button.primary { background: var(--primary); color: #fff; border: none; font-weight: 600; }
select, input { font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input); color: var(--fg); }
#login { max-width: 360px; margin: 120px auto; padding: 40px 32px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; text-align: center; }
#login input { width: 100%; margin: 8px 0; }
#login button { width: 100%; margin-top: 12px; }
#main { max-width: 1000px; margin: 0 auto; padding: 0 16px 60px; }
.bar { display: flex; gap: 8px; align-items: center; padding: 12px 0; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding-top: 8px; }
.cell { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--input); cursor: pointer; }
.cell img { width: 100%; height: 100%; object-fit: cover; }
.cell .name { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 8px 5px; font-size: 12px; background: linear-gradient(transparent, rgba(0,0,0,.65)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.album-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--card); }
.album-card .cov { aspect-ratio: 1; background: var(--input); }
.album-card .nm { padding: 10px 12px; font-weight: 600; display: flex; justify-content: space-between; }
.album-card .cnt { color: var(--muted); font-weight: 400; font-size: 13px; }
#viewer { position: fixed; inset: 0; background: rgba(0,0,0,.96); display: none; z-index: 100; }
#viewer img { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; }
#viewer .close { position: absolute; top: 14px; right: 16px; z-index: 2; }
#toast { position: fixed; top: 16px; right: 16px; z-index: 200; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--primary); padding: 12px 16px; border-radius: 10px; display: none; max-width: 360px; font-size: 14px; }
</style>
</head>
<body>
<div id="login">
  <h1 style="font-size:24px;margin:0 0 4px">牧心相册</h1>
  <p style="color:var(--muted);font-size:13px;margin:0 0 16px">家庭加密相册</p>
  <input id="user" placeholder="用户名" autocomplete="username">
  <input id="pass" type="password" placeholder="口令" autocomplete="current-password">
  <button class="primary" id="login-btn">登录</button>
</div>

<div id="main" style="display:none">
  <header>
    <span class="brand">牧心相册</span>
    <span style="flex:1"></span>
    <select id="album-sel"><option value="">全部照片</option></select>
    <button class="primary" id="upload-btn">上传</button>
    <button id="share-btn">分享</button>
    <button id="logout-btn">退出</button>
  </header>
  <div class="bar"><span id="count" style="color:var(--muted);font-size:14px"></span></div>
  <div id="content" class="grid"></div>
</div>

<div id="viewer"><button class="close" onclick="viewer.style.display='none'">✕</button><img id="full-img" alt=""></div>
<div id="toast"></div>
<input type="file" id="file-input" multiple accept="image/*,video/*" style="display:none">

<script src="/app.js"></script>
</body>
</html>
