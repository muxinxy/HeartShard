<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>牧心相册</title>
<style>
:root {
  color-scheme: dark;
  --bg: #14161a; --fg: #e8e6e3; --card: #1b1e24; --border: #23262d;
  --primary: #5b8def; --input: #12141a; --muted: #8a8f98;
  --success: #7ed6a0; --danger: #ef6a6a; --warn: #f0b45c;
  --sidebar-bg: #191c22; --row: #191c22;
}
body.theme-light {
  color-scheme: light;
  --bg: #f5f6f8; --fg: #1a1d21; --card: #ffffff; --border: #d8dce2;
  --primary: #3d6fe0; --input: #eef0f3; --muted: #6a7078;
  --success: #2e9e5c; --danger: #d44; --warn: #c8860d;
  --sidebar-bg: #eceef1; --row: #ffffff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 15px; }
button { font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; }
button.primary { background: var(--primary); color: #fff; border: none; font-weight: 600; }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input); color: var(--fg); }

/* ---------- 布局 ---------- */
#app { display: none; }
#app.layout { display: flex; min-height: 100vh; }
.sidebar { width: 200px; flex-shrink: 0; background: var(--sidebar-bg); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.sidebar .logo { font-weight: 700; font-size: 17px; padding: 6px 12px 18px; }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--fg); text-decoration: none; cursor: pointer; }
.sidebar .ic { width: 17px; height: 17px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ic.filled { fill: currentColor; stroke: none; }
button .ic, .selbar .ic, .ctx-menu .ic, .lb-bar .ic, #lb-tools .ic { vertical-align: -3px; margin-right: 5px; }
.sidebar a.active { background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--primary); font-weight: 600; }
.sidebar a:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); }
.sidebar .sec { margin: 14px 12px 4px; font-size: 12px; color: var(--muted); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
.topbar input[type=search] { flex: 1; max-width: 480px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; cursor: pointer; }
.content { flex: 1; padding: 16px 20px 60px; position: relative; }

/* ---------- 时间线网格 ---------- */
.day-header { font-size: 14px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cell { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--input); cursor: pointer; }
.cell img { width: 100%; height: 100%; object-fit: cover; }
.cell .name { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 8px 5px; font-size: 12px; color: #fff !important; background: linear-gradient(transparent, rgba(0,0,0,.75)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.9); }
.cell .check { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.35); display: grid; place-items: center; color: transparent; font-size: 13px; }
.cell.sel .check { background: var(--primary); border-color: var(--primary); color: #fff; }
.cell.sel { outline: 3px solid var(--primary); outline-offset: -3px; }
.years { position: fixed; right: 10px; top: 110px; text-align: right; font-size: 12px; color: var(--muted); user-select: none; z-index: 50; }
.years div { padding: 3px 6px; cursor: pointer; border-radius: 6px; }
.years div:hover { color: var(--primary); }
.years .rail-year { font-weight: 600; font-size: 13px; color: var(--fg); }
.years .rail-month { padding-left: 12px; font-size: 11px; }

/* ---------- 相册墙 ---------- */
.album-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-top: 8px; }
.album-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--card); }
.album-card .check { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.35); display: grid; place-items: center; color: transparent; z-index: 2; cursor: pointer; }
.album-card.sel .check { background: var(--primary); border-color: var(--primary); color: #fff; }
.album-card.sel { outline: 3px solid var(--primary); outline-offset: -3px; }
.album-card .cov { aspect-ratio: 1; background: var(--input); position: relative; }
.album-card .cov img { width: 100%; height: 100%; object-fit: cover; }
.album-card .nm { padding: 10px 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.album-card .cnt { color: var(--muted); font-weight: 400; font-size: 13px; }

/* ---------- 选择操作条 ---------- */
.selbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 32px rgba(0,0,0,.35); flex-wrap: wrap; }

/* ---------- 表格（管理） ---------- */
table.admin { width: 100%; border-collapse: collapse; margin-top: 10px; }
table.admin td, table.admin th { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
table.admin th { color: var(--muted); font-weight: 500; }
.form-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin: 14px 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.form-card input, .form-card select { margin-top: 2px; }
.form-card strong { margin-right: 4px; }
.form-card label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

/* ---------- 模态 ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 300; }
.modal { width: 460px; max-width: 94vw; max-height: 84vh; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
.modal h3 { margin: 0 0 12px; }
.modal .close { float: right; background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }

/* ---------- 灯箱 ---------- */
#viewer { position: fixed; inset: 0; background: rgba(0,0,0,.96); display: none; z-index: 120; flex-direction: column; overflow: hidden; }
#lb-bar { display: flex; align-items: center; gap: 8px; padding: 12px 18px; color: #ddd; flex-shrink: 0; }
#lb-bar button { background: none; border: 1px solid #444; color: #ddd; padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 14px; }
#lb-bar button:hover { border-color: #888; }
#lb-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: grab; position: relative; min-height: 0; }
#full-img { max-width: 100%; max-height: 100%; user-select: none; transform-origin: center center; }
#lb-video { max-width: 96%; max-height: 100%; }
#lb-tools { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(30,32,38,.9); border: 1px solid #3a3d45; border-radius: 12px; padding: 6px; z-index: 5; }
#lb-tools button { background: none; border: none; color: #ddd; font-size: 17px; width: 40px; height: 34px; border-radius: 8px; cursor: pointer; }
#lb-tools button:hover { background: rgba(255,255,255,.12); }
.cell .check { opacity: .85; }
.motion-badge { position: absolute; top: 8px; right: 8px; font-size: 14px; background: rgba(0,0,0,.5); border-radius: 6px; padding: 2px 5px; pointer-events: none; }

/* ---------- 右键菜单（鼠标位置弹出） ---------- */
.menu-overlay { position: fixed; inset: 0; z-index: 900; }
.ctx-menu {
  position: fixed;
  z-index: 901;
  display: flex;
  flex-direction: column;
  min-width: 180px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
  overflow: hidden;
  padding: 4px;
}
.ctx-menu button {
  background: none;
  border: none;
  text-align: left;
  padding: 9px 14px;
  font-size: 14px;
  color: var(--fg);
  cursor: pointer;
  border-radius: 6px;
  white-space: nowrap;
}
.ctx-menu button:hover { background: var(--secondary, rgba(128,128,128,.15)); }
.ctx-menu button.danger { color: var(--danger); }

/* ---------- 登录 ---------- */
#login { max-width: 360px; margin: 120px auto; padding: 40px 32px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; text-align: center; }
#login input { width: 100%; margin: 8px 0; }
#login button { width: 100%; margin-top: 12px; }

/* ---------- 其他 ---------- */
#toast { position: fixed; top: 16px; right: 16px; z-index: 300; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--primary); padding: 12px 16px; border-radius: 10px; display: none; max-width: 380px; font-size: 14px; white-space: pre-wrap; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 13px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--input); color: var(--muted); white-space: nowrap; }
table.admin td { word-break: break-all; }
.modal { width: min(520px, 94vw); overflow-x: hidden; }
html, body { height: 100%; }
#app.layout { height: 100vh; }
.main { overflow-y: auto; }
</style>
</head>
<body>

<div id="login">
  <h1 style="font-size:24px;margin:0 0 4px">牧心相册</h1>
  <p class="hint" style="margin:0 0 16px">家庭加密相册</p>
  <input id="user" placeholder="用户名" autocomplete="username">
  <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
  <div id="totp-row" style="display:none">
    <input id="totp-code" placeholder="两步验证码（6 位数字）" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="width:100%;margin:8px 0">
  </div>
  <div id="slider" class="slider">
    <div class="slider-fill" id="slider-fill"></div>
    <div class="slider-thumb" id="slider-thumb">»</div>
    <span class="slider-text" id="slider-text">按住滑块拖到最右侧</span>
  </div>
  <button class="primary" id="login-btn" disabled>登录</button>
</div>

<div id="app" class="layout">

  <nav class="sidebar">
    <div class="logo">牧心相册</div>
    <a data-view="photos" class="active"><svg class="ic"><use href="#i-timeline"/></svg>时间线</a>
    <a data-view="explore"><svg class="ic"><use href="#i-explore"/></svg>探索</a>
    <a data-view="albums"><svg class="ic"><use href="#i-albums"/></svg>相册</a>

    <div style="flex:1"></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <input type="search" id="search" placeholder="搜索照片 / 相册…">
      <span style="flex:1"></span>
      <button class="primary" id="upload-btn" style="display:none"><svg class="ic"><use href="#i-upload"/></svg>上传</button>
      <div style="position:relative">
        <div class="avatar" id="avatar">我</div>
        <div id="avatar-menu" style="display:none;position:absolute;right:0;top:44px;width:230px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.4);padding:10px;z-index:150;text-align:center">
          <div style="position:relative;display:inline-block;margin-top:6px">
            <div class="avatar" id="menu-avatar" style="width:72px;height:72px;font-size:28px;cursor:default">我</div>
          </div>
          <div style="font-weight:600;font-size:17px;margin:8px 0 12px" id="menu-name">我</div>
          <button id="menu-password" style="display:block;width:100%;text-align:left;border:none;background:var(--input);padding:12px 16px;border-radius:10px;margin-bottom:6px"><svg class="ic"><use href="#i-lock"/></svg>修改密码</button>
          <button id="menu-totp" style="display:block;width:100%;text-align:left;border:none;background:var(--input);padding:12px 16px;border-radius:10px;margin-bottom:6px"><svg class="ic"><use href="#i-shares"/></svg>两步验证 (2FA)</button>
          <button id="menu-theme" style="display:block;width:100%;text-align:left;border:none;background:var(--input);padding:12px 16px;border-radius:10px;margin-bottom:6px"><svg class="ic"><use href="#i-moon"/></svg>深色模式</button>
          <button id="menu-logout" style="display:block;width:100%;text-align:left;border:none;background:var(--input);padding:12px 16px;border-radius:10px;color:var(--danger)"><svg class="ic"><use href="#i-logout"/></svg>退出登录</button>
        </div>
      </div>
    </div>
    <div class="content" id="view"></div>
    <div class="years" id="years"></div>
  </div>
</div>

<div id="viewer" style="display:none">
  <div id="lb-bar">
    <span id="lb-title" style="font-weight:600"></span>
    <span style="flex:1"></span>
    <button id="lb-fav">⭐ 收藏</button>
    <button id="lb-rename">✏️ 重命名</button>
    <button id="lb-share">🔗 分享</button>
    <button id="lb-detail">ℹ️ 详情</button>
    <button id="lb-download">⬇️ 下载</button>
    <button id="lb-move">↪️ 移动到</button>
    <button id="lb-copy">⧉️ 复制到</button>
    <button id="lb-trash" style="color:var(--danger)">🗑️ 回收站</button>
    <button id="lb-close">✕</button>
  </div>
  <div id="lb-stage">
    <img id="full-img" alt="" draggable="false">
  </div>
  <div id="lb-tools">
    <button id="lb-zoom-in">＋</button>
    <button id="lb-zoom-out">－</button>
    <button id="lb-rotate">⟳</button>
    <button id="lb-flip-h">⇋</button>
    <button id="lb-flip-v">⇵</button>
    <button id="lb-reset">1:1</button>
  </div>
</div>
<div id="modal-root"></div>
<div id="ctx-root"></div>
<input type="file" id="avatar-input" accept="image/*" style="display:none">
<div id="toast"></div>
<input type="file" id="file-input" multiple accept="image/*,video/*" style="display:none">

<script src="/app.js"></script>
</body>
</html>
