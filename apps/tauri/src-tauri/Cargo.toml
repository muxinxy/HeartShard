[package]
name = "heartshard-tauri"
version = "0.1.0"
description = "HeartShard desktop shell (Windows first; Android/iOS later)"
authors = ["HeartShard contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
thiserror = "2"

# HeartShard Rust core（单一核心，四端共享；M1 直接以 Rust 依赖接入，
# WebView 侧需要时再加 WASM 绑定，见 docs/development.md）
crypto = { path = "../../../core-rs/crates/crypto" }
shard = { path = "../../../core-rs/crates/shard" }
keypath = { path = "../../../core-rs/crates/keypath" }
ida = { path = "../../../core-rs/crates/ida" }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
