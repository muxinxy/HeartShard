[package]
name = "heartshard-tauri"
version = "0.1.0"
description = "HeartShard desktop shell (Windows first; Android/iOS later)"
authors = ["HeartShard contributors"]
edition = "2024"
default-run = "heartshard-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
zeroize = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

# HeartShard Rust core（单一核心，四端共享；M1 起平台无关部分集中于 heart-core，
# Tauri 壳经 re-export 使用；bin/s3-verify 与单测仍直接引用 index/crypto）
heart-core = { path = "../../../core-rs/crates/heart-core" }
crypto = { path = "../../../core-rs/crates/crypto" }
shard = { path = "../../../core-rs/crates/shard" }
keypath = { path = "../../../core-rs/crates/keypath" }
ida = { path = "../../../core-rs/crates/ida" }
index = { path = "../../../core-rs/crates/index" }


[dev-dependencies]
tempfile = "3"
# e2e 生成真实 PNG（缩略图按需生成测试）
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# 本地补丁：android 目标强制 no-asm（见 patches/openssl-src/src/lib.rs 注释）
[patch.crates-io]
openssl-src = { path = "../../../patches/openssl-src" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
