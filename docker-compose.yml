# HeartShard 牧心后台编排
# 首次使用：
#   1. 在 .env 里设置 HEARTSHARD_LIB_PW（相册库解锁口令）
#   2. docker compose up -d
#   3. 浏览器 http://localhost:8420
#
# 配置：首次启动自动在 heartshard-meta 卷内生成 /data/meta/server.toml；
#       改配置后 `docker compose restart` 生效。
# 口令：改 .env 里 HEARTSHARD_LIB_PW 后 `docker compose up -d` 重启生效。

services:
  server:
    # 多架构镜像（amd64/arm64/armv7）；本地源码构建可换 build: ./server
    image: ghcr.io/muxinxy/heartshard-server:latest
    container_name: heartshard-server
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      - HEARTSHARD_LIB_PW=${HEARTSHARD_LIB_PW:?请在 .env 或环境变量中设置相册库口令}
      - TZ=Asia/Shanghai
    volumes:
      - heartshard-lib:/data/library
      - heartshard-meta:/data/meta
      # 云存储为本地目录时的挂载示例：
      # - /srv/photos:/photos:ro

volumes:
  heartshard-lib:
  heartshard-meta:
