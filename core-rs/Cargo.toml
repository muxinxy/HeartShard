[workspace]
resolver = "2"
members = [
    "crates/keypath",
    "crates/crypto",
    "crates/ida",
    "crates/shard",
    "crates/index",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["HeartShard contributors"]

[workspace.dependencies]
# crypto primitives (RustCrypto)
aes = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
argon2 = "0.5"
zeroize = "1"
getrandom = "0.2"
# http (S3 adapter; blocking + rustls to stay schannel-independent)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# misc
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
reed-solomon-simd = "3.1"
