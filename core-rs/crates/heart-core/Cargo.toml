[package]
name = "heart-core"
version = "0.1.0"
description = "HeartShard 平台无关核心库：HeartCore（加密/索引/同步/相册）+ 云存储适配器。桌面(Tauri)/后台/CLI 共用。"
authors = ["HeartShard contributors"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
zeroize = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
suppaftp = { version = "12", features = ["rustls-ring"] }
webpki-roots = "0.26"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
kamadak-exif = "0.6.1"

crypto = { path = "../crypto" }
shard = { path = "../shard" }
keypath = { path = "../keypath" }
ida = { path = "../ida" }
index = { path = "../index" }

# 本地补丁：android 目标强制 no-asm（见 patches/openssl-src/src/lib.rs 注释）
[patch.crates-io]
openssl-src = { path = "../../../patches/openssl-src" }
